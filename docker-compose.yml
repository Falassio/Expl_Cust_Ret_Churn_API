version: '3.8'

services:
  explainable-churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: explainable-churn-api:latest
    container_name: explainable-churn-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
